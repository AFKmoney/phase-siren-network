[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phase-siren-network"
version = "0.1.0"
description = "Non-gradient neural computation via hash weight construction and Kuramoto phase dynamics"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
]
optional-dependencies = {
    jax = ["jax>=0.4", "jaxlib>=0.4"],
    dev = ["pytest", "black", "ruff"],
}

[project.scripts]
psn-demo = "scripts.hash_psn_demo:main"

[tool.setuptools.packages.find]
include = ["psn*"]
